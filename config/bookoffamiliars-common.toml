#Maximum number of familiars a player can store.
maxFamiliars = 10
#Enable the resurrection system. If disabled, familiars will not return to the book after death
#On: dead pets return to the book after a cooldown; Domestication Innovation pet-bed respawn is off (domestication-innovation.toml) so they never come back twice.
enableResurrection = true
#Enable tracking of released familiars in the book.
enableTracking = true
