modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "fotfretrogen"
version = "1.0.0"
displayName = "Friends of the Forest Retrogen"
# Server only: players don't need it to join.
displayTest = "IGNORE_SERVER_VERSION"
description = '''
Adds placed features and structures from newly installed mods to chunks generated before them, as the chunks
load. Off until set up in config/fotfskills-retrogen.json; /fotfskills retrogen status|reload (ops). Kept the
fotfskills names (chunk tag, config, world file, command) from when it was part of FOTF Skills.
'''

[[dependencies.fotfretrogen]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "SERVER"

[[dependencies.fotfretrogen]]
modId = "openpartiesandclaims"
mandatory = false
versionRange = "*"
ordering = "AFTER"
side = "SERVER"
