modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "mimiandroidfix"
version = "1.0.0"
displayName = "MIMI Android Fix"
description = '''
Stops MIMI crashing on Android launchers (Zalith/Pojav/FCL), where Java has no audio output.
Gives MIMI a silent audio line only when no real one exists; does nothing on a normal PC.
'''
# Client-only helper with no network channels: never blocks joining a server.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.mimiandroidfix]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.mimiandroidfix]]
modId = "mimi"
mandatory = false
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"
