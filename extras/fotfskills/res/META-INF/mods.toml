modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "fotfskills"
version = "1.0.0"
displayName = "Friends of the Forest Skills"
description = '''
Add-on for Pufferfish's Skills: a compact, advancement-sized skill window, and node ranks drawn as one tile
with an owned/total counter. Later: the custom perks and XP sources for the FOTF skill trees.
'''

[[dependencies.fotfskills]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.fotfskills]]
modId = "puffish_skills"
mandatory = true
# The client mixin targets Pufferfish 0.19.1 internals (lambda names, private members). A Pufferfish update
# needs fotfskills rebuilt and checked; until then Forge shows "missing dependency" instead of crashing.
versionRange = "[0.19.1,0.19.2)"
ordering = "AFTER"
side = "BOTH"
